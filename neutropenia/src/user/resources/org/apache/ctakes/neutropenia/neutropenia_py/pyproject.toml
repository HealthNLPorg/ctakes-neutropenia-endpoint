[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neutropenia"
version = "7.0.0"
authors = [
    { name="BCH Health NLP Lab", email="eli.goldner@childrens.harvard.edu" },
]
description = "cTAKES PBJ based harness for the neutropenia clinical genomics extraction LangGraph workflow"
readme = "README.md"
requires-python = "~=3.12.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ruff>=0.15.2",
    "ty>=0.0.18",
    "ctakes-pbj~=7.0.0",
    "neutropenia-clingen-agents@git+https://github.com/HealthNLPorg/neutropenia_clingen_agents",
]

[project.urls]
"Homepage" = "https://www.w3.org/Provider/Style/dummy.html"
"Bug Tracker" = "https://www.w3.org/Provider/Style/dummy.html"

